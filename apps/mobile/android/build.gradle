buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 24
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.24"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

// MSAL's transitive `com.microsoft.device.display:display-mask` is published
// only to Microsoft's public Duo SDK feed (not Maven Central/Google), so the
// repository must be available wherever the app resolves dependencies.
allprojects {
    repositories {
        maven {
            name = "DuoSDKFeed"
            url = uri("https://pkgs.dev.azure.com/MicrosoftDeviceSDK/DuoSDK-Public/_packaging/Duo-SDK-Feed/maven/v1")
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
