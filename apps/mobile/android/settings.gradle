// React Native 0.75 settings for a hoisted npm-workspaces monorepo.
// Gradle requires pluginManagement to be the very first block, so the plugin
// path is referenced relative to this file. The React Native CLI is resolved
// afterwards through the settings directory for autolinking.
pluginManagement {
    includeBuild("../../../node_modules/@react-native/gradle-plugin")
}

plugins {
    id("com.facebook.react.settings")
}

def workspaceRoot = settingsDir.parentFile.parentFile.parentFile
def reactNativeCli = new File(workspaceRoot, "node_modules/react-native/cli.js").absolutePath

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand(["node", reactNativeCli, "config"])
}

rootProject.name = 'GSTFlowClient'
include ':app'

// Keep the plugin build available to the app project as well (autolinking).
includeBuild("../../../node_modules/@react-native/gradle-plugin")
