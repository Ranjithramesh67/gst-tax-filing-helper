apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// In a hoisted npm-workspaces monorepo, react-native lives in the repository-root
// node_modules rather than apps/mobile/node_modules. Resolve it through Node so
// the React Gradle plugin (codegen, bundling, Hermes) finds it.
def resolvedReactNativeDir = new File(
    providers.exec {
        workingDir(rootDir)
        commandLine("node", "--print", "require.resolve('react-native/package.json')")
    }.standardOutput.asText.get().trim()
).getParentFile()
def resolvedNodeModulesDir = resolvedReactNativeDir.getParentFile()

// Remote JS bundle for the debug build. Override with
// `-PjsBundleUrl=https://<preview-host>/mobile/index.android.bundle` when the
// preview URL changes. Empty keeps the debug build on the bundled asset.
def jsBundleUrl = project.findProperty("jsBundleUrl")
    ?: "https://3000-5ffbba644f10a9c0.monkeycode-ai.live/mobile/index.android.bundle"

// Backend base URL used by the native SMS uploader so captured messages can be
// forwarded with no JS running. Override with `-PapiBaseUrl=...` if the preview
// host changes.
def apiBaseUrl = project.findProperty("apiBaseUrl")
    ?: "https://3000-5ffbba644f10a9c0.monkeycode-ai.live/api"

/**
 * React Native Gradle plugin configuration. Autolinking happens through the
 * React Gradle plugin (RN 0.75+), so no manual native_modules.gradle apply.
 */
react {
    /* Folders - defaults are relative to apps/mobile, overridden for the monorepo. */
    reactNativeDir = resolvedReactNativeDir
    codegenDir = new File(resolvedNodeModulesDir, "@react-native/codegen")
    cliFile = new File(resolvedReactNativeDir, "cli.js")

    /* Hoisted install: the bundled Hermes compiler lives under the workspace root. */
    hermesCommand = new File(resolvedReactNativeDir, "sdks/hermesc/%OS-BIN%/hermesc").absolutePath

    /* Autolinking */
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.gstflow.client"

    defaultConfig {
        applicationId "com.gstflow.client"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        buildConfig true
    }

    // Produce small per-ABI APKs (plus a universal fallback) so downloads are
    // less error-prone and installs are not rejected for carrying unused ABIs.
    splits {
        abi {
            reset()
            enable true
            universalApk true
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    signingConfigs {
        debug {
            // Sign with every scheme for the widest device compatibility.
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        debug {
            // Uses the auto-generated debug keystore provided by AGP.
            // Fetches JavaScript from the preview host at launch so updates do
            // not require reinstalling the APK.
            buildConfigField "String", "JS_BUNDLE_URL", "\"${jsBundleUrl}\""
            buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""
        }
        release {
            minifyEnabled enableProguardInReleaseBuilds
            // Sideload distribution: sign with the AGP-generated debug keystore so
            // the artifact is installable without managing a private release key.
            signingConfig signingConfigs.debug
            // Release builds use the JavaScript bundled into the APK.
            buildConfigField "String", "JS_BUNDLE_URL", "\"\""
            buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // JVM unit tests for pure-Kotlin logic (e.g. OtpExtractor). The real org.json
    // artifact shadows the stubbed android.jar so fixtures can be parsed locally.
    testImplementation("junit:junit:4.13.2")
    testImplementation("org.json:json:20240303")
}
