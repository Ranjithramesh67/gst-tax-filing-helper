services:
  postgres:
    image: postgres:15
    container_name: gstflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gstflow
      POSTGRES_PASSWORD: gstflow
      POSTGRES_DB: gstflow
    ports:
      - "5432:5432"
    volumes:
      - gstflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gstflow -d gstflow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gstflow_pgdata:
